
location = /health { include /etc/nginx/snippets/sub2api-proxy.conf; }
location = /v1 { include /etc/nginx/snippets/sub2api-proxy.conf; }
location /v1/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /v1beta/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /openai/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /backend-api/codex/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /chat/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /images/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /audio/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location = /responses { include /etc/nginx/snippets/sub2api-proxy.conf; }
location ^~ /responses/ { include /etc/nginx/snippets/sub2api-proxy.conf; }
location = /models { include /etc/nginx/snippets/sub2api-proxy.conf; }
location = /embeddings { include /etc/nginx/snippets/sub2api-proxy.conf; }
location = /completions { include /etc/nginx/snippets/sub2api-proxy.conf; }

location / {
    default_type application/json;
    return 404 "{\"error\":{\"message\":\"Not found. This endpoint only supports API requests. 网页访问请前往主站：https://example.com/\",\"type\":\"not_found\"}}\n";
}
