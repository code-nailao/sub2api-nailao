<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>无限画布 · Sources</title>
  <link rel="stylesheet" href="/ops-assets/studio.css">
</head>
<body data-surface="canvas" data-state="loading" data-shell-mode="embedded" aria-busy="true">
  <header id="canvas-controls" aria-label="画布连接" hidden>
    <a id="canvas-home" href="/" target="_top" hidden>返回主站</a>
    <strong id="canvas-title" hidden>无限画布</strong>
    <label class="canvas-group">生图分组 <select id="groups" aria-label="生图分组"></select></label>
    <details id="canvas-connection-menu">
      <summary>连接与授权</summary>
      <div class="canvas-connection-actions">
        <a id="keys" href="/keys" target="_top">管理授权</a>
        <button id="lock" type="button">锁定画布</button>
      </div>
    </details>
    <a id="canvas-open" target="_blank" rel="noopener noreferrer" hidden>独立打开</a>
  </header>
  <section id="canvas-status" aria-labelledby="canvas-status-title">
    <span class="canvas-loading-mark" aria-hidden="true"></span>
    <h1 id="canvas-status-title">正在打开无限画布</h1>
    <p id="message" role="status" aria-live="polite">正在连接画布，请稍候…</p>
    <div id="canvas-recovery" hidden>
      <button id="canvas-retry" type="button">重试连接</button>
      <a id="canvas-login" href="/login" target="_top" hidden>重新登录</a>
      <a href="/" target="_top">返回主站</a>
    </div>
  </section>
  <iframe id="studio" title="无限画布创作区" hidden referrerpolicy="no-referrer"></iframe>
  <script src="/ops-assets/canvas.js" type="module"></script>
</body>
</html>
