name: Sources clean release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact tag or branch/ref; a branch is always a dry run'
        required: true
        type: string
      resume_run_id:
        description: 'Original release run ID after partial publication; reuse its exact bundle and receipts'
        required: false
        type: string
      components:
        description: 'Publication scope; auto uses source-pinned per-version scope, otherwise Main and Portal'
        required: false
        type: choice
        options: [auto, main, both]
        default: auto
      simple_release:
        description: 'Compatibility input; clean releases target linux/amd64'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Build and verify without publishing images or a release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sources-clean-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
      components: ${{ steps.identity.outputs.components }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # A renamed or forked repository must fail loudly, never skip silently.
      - name: Require the repository named by the source identity file
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from sources_baseline import load_identity; print(load_identity()["repository"])')
          if [[ "$REPOSITORY" != "$expected" ]]; then
            echo "Release runs only in $expected; this run is in $REPOSITORY" >&2
            exit 1
          fi
      - name: Fetch and verify the fixed upstream baseline
        run: python3 scripts/sources_extensions/fetch_baseline.py
      - id: identity
        name: Bind an immutable source and publication intent
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          COMPONENT_REQUEST: ${{ inputs.components || 'auto' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          publish=false
          REQUESTED_REF=${REQUESTED_REF#refs/tags/}
          if git show-ref --verify --quiet "refs/tags/$REQUESTED_REF"; then
            test "$REQUESTED_REF" = "v$version" || { echo 'Tag / VERSION mismatch' >&2; exit 1; }
            test "$(git rev-parse "refs/tags/$REQUESTED_REF^{commit}")" = "$sha"
            if [[ "$DRY_RUN" != true ]]; then publish=true; fi
          fi
          if [[ -f .github/release-tools/clean_components.py ]]; then
            components=$(python3 .github/release-tools/clean_components.py resolve --version "$version" --requested "$COMPONENT_REQUEST")
          else
            # Older immutable refs retain their original two-component publisher.
            [[ "$COMPONENT_REQUEST" == auto || "$COMPONENT_REQUEST" == both ]] || { echo 'This source predates scoped publication' >&2; exit 1; }
            components=main,portal
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Restore immutable inputs for an explicit publication retry
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_RUN: ${{ inputs.resume_run_id }}
          SOURCE_SHA: ${{ steps.identity.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$ORIGINAL_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$ORIGINAL_RUN" > original-run.json
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$REPOSITORY" '.head_sha==$sha and .head_repository.full_name==$repo and .path==".github/workflows/release.yml" and .status=="completed"' original-run.json
          gh run download "$ORIGINAL_RUN" --repo "$REPOSITORY" --name "sources-core-$SOURCE_SHA" --dir "$RUNNER_TEMP/sources-build"
          python3 scripts/sources_release/verify_bundle.py "$RUNNER_TEMP/sources-build" --sha "$SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: |
            backend/go.sum
            extensions/sources-media-engine/go.sum
      - name: Verify fixed Go toolchain
        run: go version | grep -q 'go1.27.4'
      - name: Build Main and Portal, including nested module tests
        if: inputs.resume_run_id == ''
        run: scripts/sources_release/build.sh "$RUNNER_TEMP/sources-build"
      - uses: actions/upload-artifact@v7
        with:
          name: sources-core-${{ steps.identity.outputs.sha }}
          path: ${{ runner.temp }}/sources-build/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: sources-core-${{ needs.build.outputs.sha }}
          path: release-input
      - name: Require the latest exact-source native push CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sources_release/ci_gate.py --repository "$REPOSITORY" --sha '${{ needs.build.outputs.sha }}' --output ci-receipt.json
      - name: Restore the original partial publication receipt
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_RUN: ${{ inputs.resume_run_id }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run download "$ORIGINAL_RUN" --repo "$REPOSITORY" --name "sources-published-$SOURCE_SHA" --dir previous-publication
          test -f previous-publication/published-images.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifact hashes before image construction
        run: python3 scripts/sources_release/verify_bundle.py release-input --sha '${{ needs.build.outputs.sha }}'
      - name: ${{ needs.build.outputs.components == 'main' && 'Publish fixed Main image, never a floating tag' || 'Publish fixed Main and Portal images, never a floating tag' }}
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          ORIGINAL_RUN: ${{ inputs.resume_run_id }}
          PUBLISH_COMPONENTS: ${{ needs.build.outputs.components }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ORIGINAL_RUN" ]]; then args+=(--resume "$PWD/previous-publication/published-images.json"); fi
          if [[ -f .github/release-tools/clean_components.py ]]; then
            python3 .github/release-tools/clean_components.py images --bundle "$PWD/release-input" --output "$PWD/publication" \
              --sha "$SOURCE_SHA" --version "$VERSION" --ci "$PWD/ci-receipt.json" --components "$PUBLISH_COMPONENTS" "${args[@]}"
          else
            [[ "$PUBLISH_COMPONENTS" == main,portal ]]
            scripts/sources_release/publish.sh "$PWD/release-input" --output "$PWD/publication" --ci "$PWD/ci-receipt.json" "${args[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sources-published-${{ needs.build.outputs.sha }}
          path: publication/*.json
          if-no-files-found: warn
          retention-days: 90
      # The bundle is deliberately not promoted to Latest and never edits main.
      # An operator validates the independent Studio CI artifact and completes
      # the three-component manifest before any production cold deployment.
      - name: Create or verify the non-latest release and only fill missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_COMPONENTS: ${{ needs.build.outputs.components }}
        run: |
          set -euo pipefail
          if [[ -f .github/release-tools/clean_components.py ]]; then
            python3 .github/release-tools/clean_components.py assets --bundle release-input --publication publication \
              --notes deploy/clean/RELEASE-NOTES.md --components "$PUBLISH_COMPONENTS"
          else
            [[ "$PUBLISH_COMPONENTS" == main,portal ]]
            python3 scripts/sources_release/release_assets.py --bundle release-input --publication publication --notes deploy/clean/RELEASE-NOTES.md
          fi
