name: 新功能
description: 新能力，或对已有能力的改进
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        **这个仓库是公开的。** 只描述产品和代码层面的需求。不要写主机地址、真实域名、服务器路径、端口、容器名、金额或数量、上游供应商或渠道名称、用户数据、密钥；示例使用占位值。运维、事故和资金细节不写在这里。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在做不到什么，谁会遇到。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 做完后的行为。原版设置或标准 API 能做到的，优先用它们而不是改核心。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些可以检查的条件就算完成。
    validations:
      required: true
