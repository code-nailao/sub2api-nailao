name: 缺陷
description: 已有功能的行为不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **这个仓库是公开的。** 只描述代码层面的现象和修复目标。不要写主机地址、真实域名、服务器路径、端口、容器名、金额或数量、上游供应商或渠道名称、用户数据、密钥；日志和截图先脱敏，示例使用占位值。运维、事故和资金细节不写在这里。安全漏洞请使用私密漏洞报告，不要开公开 issue。
  - type: textarea
    id: actual
    attributes:
      label: 现象
      description: 哪个功能，在什么输入或配置下，实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 应该发生什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现
      description: 最少的步骤，或一个能复现的测试用例。还不能稳定复现时，写已知的触发条件。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 出现问题的发布版本号或提交 SHA。
